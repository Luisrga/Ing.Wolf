<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmador PDF | Ing. Wolf</title>
<meta name="description" content="Firma y edita tus PDF en el navegador. Tu archivo no se sube a ningún servidor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3FB;--text:#0A1633;--muted:#44557A;--card:#FFFFFF;--border:#CBD7EE;--accent:#1D4ED8;--on-accent:#FFFFFF;--danger:#B91C1C}
:root[data-theme="dark"]{--bg:#050A18;--text:#E6EEFF;--muted:#9FB2D9;--card:#0B1630;--border:#1E3366;--accent:#3B82F6;--on-accent:#050A18;--danger:#F87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 48px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0;flex-wrap:wrap}
.bar .right{display:flex;gap:8px}
button,.btn{min-height:44px;min-width:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:hover:not(:disabled),.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
h1{font-size:1.8rem;margin:8px 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
.drop{border:2px dashed var(--border);border-radius:14px;padding:32px 16px;text-align:center;background:var(--card)}
.drop.over{border-color:var(--accent)}
.drop p{margin:0 0 12px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.tools .sp{flex:1}
.pager{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.scroll{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--card);padding:12px;text-align:center}
#stage{position:relative;display:inline-block;touch-action:none;box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff}
#stage canvas{display:block}
.item{position:absolute;cursor:grab;user-select:none;touch-action:none;border:1.5px dashed transparent;line-height:1;color:#0A1633;white-space:nowrap}
.item img{display:block;width:100%;pointer-events:none}
.item.sel{border-color:var(--accent)}
.hint,.note{color:var(--muted);font-size:.9rem}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);padding:16px;max-width:96vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
#pad{background:#fff;border-radius:10px;border:1px solid var(--border);touch-action:none;width:min(460px,80vw);height:auto;display:block}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#msg{min-height:1.4em;color:var(--danger);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="btn" href="./" data-i18n="back">← Ing. Wolf</a>
    <div class="right">
      <button id="lang" type="button">English</button>
      <button id="theme" type="button">☀️ Claro</button>
    </div>
  </div>

  <h1>Firmador PDF</h1>
  <p class="sub" data-i18n="sub"></p>

  <div class="drop" id="drop">
    <p data-i18n="drop"></p>
    <button class="primary" id="pick" type="button" data-i18n="choose"></button>
    <input id="file" type="file" accept="application/pdf" hidden>
  </div>
  <p id="msg" role="alert"></p>

  <section id="editor" hidden>
    <div class="tools">
      <button id="addSign" type="button" data-i18n="sign"></button>
      <button id="addText" type="button" data-i18n="text"></button>
      <button id="addDate" type="button" data-i18n="date"></button>
      <span class="sp"></span>
      <button id="smaller" type="button" disabled aria-label="−">A−</button>
      <button id="bigger" type="button" disabled aria-label="+">A+</button>
      <button id="del" type="button" disabled data-i18n="remove"></button>
    </div>
    <div class="tools">
      <div class="pager">
        <button id="prev" type="button" aria-label="←">←</button>
        <span id="pageinfo"></span>
        <button id="next" type="button" aria-label="→">→</button>
      </div>
      <span class="sp"></span>
      <button class="primary" id="download" type="button" data-i18n="download"></button>
    </div>
    <div class="scroll" id="scroll"><div id="stage"><canvas id="cv"></canvas></div></div>
    <p class="hint" data-i18n="hint"></p>
  </section>

  <p class="note" data-i18n="privacy"></p>
</div>

<dialog id="dlg">
  <p style="margin:0 0 8px;font-weight:600" data-i18n="drawHere"></p>
  <canvas id="pad" width="920" height="360"></canvas>
  <div class="dlg-actions">
    <button id="padClear" type="button" data-i18n="clear"></button>
    <button id="padCancel" type="button" data-i18n="cancel"></button>
    <button id="padOk" type="button" class="primary" data-i18n="accept"></button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
var TEXT = {
  es:{back:"← Ing. Wolf",sub:"Firma y edita tus PDF directo en el navegador.",drop:"Arrastra tu PDF aquí o elígelo desde tu dispositivo.",
      choose:"Elegir PDF",sign:"✍️ Firma",text:"🔤 Texto",date:"📅 Fecha",remove:"Quitar",download:"Descargar PDF firmado",
      hint:"Toca o arrastra un elemento para moverlo. Usa A− y A+ para cambiar su tamaño.",
      privacy:"🔒 Tu PDF se procesa en tu dispositivo y no se sube a ningún servidor.",
      drawHere:"Dibuja tu firma",clear:"Borrar",cancel:"Cancelar",accept:"Usar firma",
      page:"Página",of:"de",prompt:"Escribe el texto:",errPdf:"No se pudo abrir ese archivo. Elige un PDF válido.",
      errSave:"No se pudo generar el PDF.",empty:"Dibuja tu firma primero.",toDark:"🌙 Oscuro",toLight:"☀️ Claro",otherLang:"English"},
  en:{back:"← Ing. Wolf",sub:"Sign and edit your PDFs right in the browser.",drop:"Drag your PDF here or choose it from your device.",
      choose:"Choose PDF",sign:"✍️ Signature",text:"🔤 Text",date:"📅 Date",remove:"Remove",download:"Download signed PDF",
      hint:"Tap or drag an item to move it. Use A− and A+ to resize it.",
      privacy:"🔒 Your PDF is processed on your device and never uploaded to any server.",
      drawHere:"Draw your signature",clear:"Clear",cancel:"Cancel",accept:"Use signature",
      page:"Page",of:"of",prompt:"Type the text:",errPdf:"Could not open that file. Choose a valid PDF.",
      errSave:"Could not generate the PDF.",empty:"Draw your signature first.",toDark:"🌙 Dark",toLight:"☀️ Light",otherLang:"Español"}
};

var root = document.documentElement;
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function save(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
var lang  = load("lang")  || ((navigator.language || "es").toLowerCase().indexOf("en") === 0 ? "en" : "es");
var theme = load("theme") || "dark";
function $(id){ return document.getElementById(id); }

function applyI18n(){
  var t = TEXT[lang];
  root.lang = lang; root.setAttribute("data-theme", theme);
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t[el.getAttribute("data-i18n")]; });
  $("lang").textContent = t.otherLang;
  $("theme").textContent = theme === "dark" ? t.toLight : t.toDark;
  updatePager();
}
$("lang").addEventListener("click", function(){ lang = lang === "es" ? "en" : "es"; save("lang", lang); applyI18n(); });
$("theme").addEventListener("click", function(){ theme = theme === "dark" ? "light" : "dark"; save("theme", theme); applyI18n(); });

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

var S = { bytes:null, name:"documento", doc:null, page:1, pages:0, items:[], sel:null, token:0 };
var stage = $("stage"), cv = $("cv");

function setMsg(m){ $("msg").textContent = m || ""; }

// ---------- cargar PDF ----------
function openFile(file){
  setMsg("");
  if (!file) return;
  file.arrayBuffer().then(function(buf){
    S.bytes = new Uint8Array(buf);
    S.name = file.name.replace(/\.pdf$/i, "");
    return pdfjsLib.getDocument({ data: S.bytes.slice(0) }).promise;
  }).then(function(doc){
    S.doc = doc; S.pages = doc.numPages; S.page = 1; S.items = []; S.sel = null;
    $("editor").hidden = false;
    return renderPage();
  }).catch(function(){ setMsg(TEXT[lang].errPdf); });
}
$("pick").addEventListener("click", function(){ $("file").click(); });
$("file").addEventListener("change", function(e){ openFile(e.target.files[0]); e.target.value = ""; });
["dragover","dragenter"].forEach(function(ev){ $("drop").addEventListener(ev, function(e){ e.preventDefault(); $("drop").classList.add("over"); }); });
["dragleave","drop"].forEach(function(ev){ $("drop").addEventListener(ev, function(e){ e.preventDefault(); $("drop").classList.remove("over"); }); });
$("drop").addEventListener("drop", function(e){ openFile(e.dataTransfer.files[0]); });

// ---------- dibujar página ----------
function stageWidth(){ return parseFloat(stage.style.width) || cv.clientWidth; }

function renderPage(){
  var my = ++S.token;
  return S.doc.getPage(S.page).then(function(page){
    var base = page.getViewport({ scale: 1 });
    var cssW = Math.min($("scroll").clientWidth - 24, 760);
    var dpr = window.devicePixelRatio || 1;
    var vp = page.getViewport({ scale: (cssW / base.width) * dpr });
    cv.width = vp.width; cv.height = vp.height;
    cv.style.width = cssW + "px"; cv.style.height = (vp.height / dpr) + "px";
    stage.style.width = cssW + "px";
    return page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
  }).then(function(){
    if (my === S.token) { renderItems(); updatePager(); }
  });
}
function updatePager(){
  var t = TEXT[lang];
  $("pageinfo").textContent = t.page + " " + S.page + " " + t.of + " " + S.pages;
  $("prev").disabled = S.page <= 1;
  $("next").disabled = S.page >= S.pages;
}
$("prev").addEventListener("click", function(){ if (S.page > 1) { S.page--; S.sel = null; renderPage(); } });
$("next").addEventListener("click", function(){ if (S.page < S.pages) { S.page++; S.sel = null; renderPage(); } });
window.addEventListener("resize", function(){ if (S.doc) renderPage(); });

// ---------- elementos (firma / texto / fecha) ----------
function renderItems(){
  stage.querySelectorAll(".item").forEach(function(n){ n.remove(); });
  var w = stageWidth();
  S.items.forEach(function(it){
    if (it.page !== S.page) return;
    var el = document.createElement("div");
    el.className = "item" + (it === S.sel ? " sel" : "");
    el.style.left = (it.x * 100) + "%"; el.style.top = (it.y * 100) + "%";
    if (it.type === "img") {
      el.style.width = (it.w * 100) + "%";
      var im = document.createElement("img"); im.src = it.dataUrl; im.alt = ""; el.appendChild(im);
    } else {
      el.style.fontSize = (it.fs * w) + "px";
      el.textContent = it.text;
    }
    el.addEventListener("pointerdown", function(e){ startDrag(e, it, el); });
    stage.appendChild(el);
  });
  var has = !!S.sel;
  $("smaller").disabled = $("bigger").disabled = $("del").disabled = !has;
}
function select(it){ S.sel = it; renderItems(); }

function startDrag(e, it, el){
  e.preventDefault();
  S.sel = it;
  stage.querySelectorAll(".item").forEach(function(n){ n.classList.remove("sel"); });
  el.classList.add("sel");
  $("smaller").disabled = $("bigger").disabled = $("del").disabled = false;
  el.setPointerCapture(e.pointerId);
  var r = stage.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, ox = it.x, oy = it.y;
  function move(ev){
    it.x = Math.max(0, Math.min(0.98, ox + (ev.clientX - sx) / r.width));
    it.y = Math.max(0, Math.min(0.98, oy + (ev.clientY - sy) / r.height));
    el.style.left = (it.x * 100) + "%"; el.style.top = (it.y * 100) + "%";
  }
  function up(){ el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); }
  el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
}
stage.addEventListener("pointerdown", function(e){
  if (e.target === cv) { S.sel = null; renderItems(); }
});

function addText(txt){
  if (!txt) return;
  var it = { type:"text", page:S.page, x:0.3, y:0.4, fs:0.03, text:txt };
  S.items.push(it); select(it);
}
$("addText").addEventListener("click", function(){ var v = window.prompt(TEXT[lang].prompt); if (v) addText(v.trim()); });
$("addDate").addEventListener("click", function(){
  addText(new Date().toLocaleDateString(lang === "es" ? "es-MX" : "en-US"));
});
$("bigger").addEventListener("click", function(){ resize(1.15); });
$("smaller").addEventListener("click", function(){ resize(1 / 1.15); });
function resize(f){
  if (!S.sel) return;
  if (S.sel.type === "img") S.sel.w = Math.max(0.05, Math.min(0.9, S.sel.w * f));
  else S.sel.fs = Math.max(0.01, Math.min(0.12, S.sel.fs * f));
  renderItems();
}
$("del").addEventListener("click", function(){
  S.items = S.items.filter(function(i){ return i !== S.sel; });
  S.sel = null; renderItems();
});

// ---------- firma dibujada ----------
var pad = $("pad"), pctx = pad.getContext("2d"), drawing = false, inked = false;
function resetPad(){ pctx.clearRect(0, 0, pad.width, pad.height); inked = false; }
function padPos(e){
  var r = pad.getBoundingClientRect();
  return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height };
}
pad.addEventListener("pointerdown", function(e){
  e.preventDefault(); drawing = true; pad.setPointerCapture(e.pointerId);
  var p = padPos(e);
  pctx.strokeStyle = "#0A1633"; pctx.lineWidth = 6; pctx.lineCap = "round"; pctx.lineJoin = "round";
  pctx.beginPath(); pctx.moveTo(p.x, p.y); pctx.lineTo(p.x + 0.1, p.y + 0.1); pctx.stroke(); inked = true;
});
pad.addEventListener("pointermove", function(e){
  if (!drawing) return;
  var p = padPos(e); pctx.lineTo(p.x, p.y); pctx.stroke();
});
["pointerup","pointercancel"].forEach(function(ev){ pad.addEventListener(ev, function(){ drawing = false; }); });

$("addSign").addEventListener("click", function(){ resetPad(); setMsg(""); $("dlg").showModal(); });
$("padClear").addEventListener("click", resetPad);
$("padCancel").addEventListener("click", function(){ $("dlg").close(); });
$("padOk").addEventListener("click", function(){
  if (!inked) { setMsg(TEXT[lang].empty); $("dlg").close(); return; }
  var d = pctx.getImageData(0, 0, pad.width, pad.height).data, minX = pad.width, minY = pad.height, maxX = 0, maxY = 0;
  for (var y = 0; y < pad.height; y++) for (var x = 0; x < pad.width; x++) {
    if (d[(y * pad.width + x) * 4 + 3] > 0) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  var pw = maxX - minX + 12, ph = maxY - minY + 12, out = document.createElement("canvas");
  out.width = pw; out.height = ph;
  out.getContext("2d").drawImage(pad, minX - 6, minY - 6, pw, ph, 0, 0, pw, ph);
  var it = { type:"img", page:S.page, x:0.35, y:0.4, w:0.28, aspect: ph / pw, dataUrl: out.toDataURL("image/png") };
  S.items.push(it); $("dlg").close(); select(it);
});

// ---------- descargar ----------
$("download").addEventListener("click", function(){
  setMsg("");
  PDFLib.PDFDocument.load(S.bytes).then(function(pdf){
    return pdf.embedFont(PDFLib.StandardFonts.Helvetica).then(function(font){
      var chain = Promise.resolve();
      S.items.forEach(function(it){
        chain = chain.then(function(){
          var page = pdf.getPage(it.page - 1), sz = page.getSize();
          if (it.type === "img") {
            return pdf.embedPng(it.dataUrl).then(function(png){
              var w = it.w * sz.width, h = w * it.aspect;
              page.drawImage(png, { x: it.x * sz.width, y: sz.height - it.y * sz.height - h, width: w, height: h });
            });
          }
          var size = it.fs * sz.width;
          page.drawText(it.text, { x: it.x * sz.width, y: sz.height - it.y * sz.height - size * 0.82, size: size, font: font, color: PDFLib.rgb(0.04, 0.09, 0.2) });
        });
      });
      return chain.then(function(){ return pdf.save(); });
    });
  }).then(function(bytes){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    a.download = S.name + "-firmado.pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
  }).catch(function(){ setMsg(TEXT[lang].errSave); });
});

applyI18n();
</script>
</body>
</html>
