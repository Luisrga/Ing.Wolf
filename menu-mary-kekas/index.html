<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mary Kekas | Menú</title>
<meta name="description" content="Menú digital de Mary Kekas Cancún: antojitos artesanales con recetas tradicionales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F6EDD3; --cream2:#EADFB8; --ink:#2F1A17; --card:#FFFBEF; --muted:#6F5A50;
  --brown:#3A1F1C; --red:#A8363A; --mustard:#E3A82B; --green:#4E9A62; --blue:#3E67A8;
  --line:#2F1A17;
  --check: repeating-conic-gradient(var(--cream2) 0 25%, var(--cream) 0 50%) 0 0/36px 36px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--check);background-attachment:fixed;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Bowlby One","Arial Black",sans-serif;font-weight:400;letter-spacing:.01em}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* Encabezado */
header{text-align:center;padding:36px 0 22px}
.logo{display:inline-grid;place-items:center;width:128px;height:128px;border-radius:50%;background:var(--check);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);margin-bottom:16px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.logo span{background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:8px 14px;font-family:"Bowlby One";font-size:1.15rem;line-height:1;transform:rotate(-6deg)}
h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1;text-shadow:3px 3px 0 var(--mustard)}
.tag{margin:10px auto 0;max-width:34ch;color:var(--muted);font-weight:500}
.bar{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.pill{min-height:44px;padding:0 18px;border:3px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);font:700 .95rem "DM Sans";cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.pill:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.pill:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* Navegación fija */
nav{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:3px solid var(--ink)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border:2px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.9rem;background:var(--card);transition:background .2s,color .2s}
nav a.on{background:var(--ink);color:var(--cream)}

/* Secciones */
section{padding:34px 0 6px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.head h2{font-size:clamp(1.7rem,6vw,2.5rem);line-height:1;background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:12px;transform:rotate(-1.2deg);box-shadow:5px 5px 0 var(--mustard)}
.desc{color:var(--muted);max-width:60ch;margin:14px 0 18px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.tier{background:var(--card);border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.tier.in{opacity:1;transform:none}
.tier{display:flex;flex-direction:column}
.tier .items{padding:6px 16px;flex:1}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(47,26,23,.28);font-weight:500}
.row:last-child{border-bottom:0}
.row b{font-family:"Bowlby One";font-weight:400;font-size:1.1rem;white-space:nowrap}
.extra{display:flex;justify-content:space-between;padding:8px 16px;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.k-brown .extra{background:var(--brown)} .k-red .extra{background:var(--red)}
.k-mustard .extra{background:#B8841A} .k-green .extra{background:#3A7A4C}
.tier{border-top-width:12px}
.k-brown{border-top-color:var(--brown)} .k-red{border-top-color:var(--red)}
.k-mustard{border-top-color:var(--mustard)} .k-green{border-top-color:var(--green)}
.addons{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:700}
.chip{border:2px solid var(--ink);border-radius:999px;padding:4px 14px;background:var(--card);font-size:.9rem}

/* Promos */
.promos{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.promos{grid-template-columns:1fr 1fr}}
.promo{border:3px solid var(--ink);border-radius:16px;padding:18px;background:var(--card);box-shadow:5px 5px 0 var(--ink);position:relative;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.promo.in{opacity:1;transform:none}
.promo .day{display:inline-block;font-family:"Bowlby One";font-size:.85rem;background:var(--mustard);border:2px solid var(--ink);border-radius:8px;padding:3px 10px;margin-bottom:10px;text-transform:uppercase}
.promo h3{font-size:1.25rem;line-height:1.15;margin-bottom:6px}
.promo p{color:var(--muted);font-size:.95rem}
.promo.b{background:#DCE7F7} .promo.g{background:#DDEFE1} .promo.r{background:#F6DADA}

/* Bebidas */
.drinks{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.drinks{grid-template-columns:repeat(3,1fr)}}
.drink{border:3px solid var(--ink);border-radius:16px;padding:20px;text-align:center;box-shadow:5px 5px 0 var(--ink);opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.drink.in{opacity:1;transform:none}
.drink h3{font-size:1.2rem;margin-bottom:6px}
.drink .pr{font-family:"Bowlby One";font-size:2.2rem}
.d1{background:#F9D98C}.d2{background:#B9CCEB}.d3{background:#E7A3A3}

footer{text-align:center;padding:40px 0 60px;color:var(--muted);font-size:.9rem}
footer a{color:var(--ink);font-weight:700}
.note{margin-top:8px;font-size:.82rem}
@keyframes pop{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.tier,.promo,.drink{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo" aria-hidden="true"><span>Mary Kekas</span></div>
    <h1>Mary Kekas</h1>
    <p class="tag" data-i="tagline">Antojitos artesanales hechos con recetas tradicionales</p>
    <div class="bar">
      <button class="pill" id="langBtn" type="button" aria-label="Cambiar idioma / Change language">EN</button>
      <a class="pill" href="https://www.instagram.com/marykekascancun/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</header>
<nav aria-label="Secciones"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="menu"></main>
<footer>
  <div class="wrap">
    <p data-i="foot">Precios en pesos mexicanos. Sujetos a cambio sin previo aviso.</p>
    <p class="note" data-i="demo">Menú digital de demostración creado por <a href="../">Ing. Wolf</a>.</p>
  </div>
</footer>

<script>
// ===== Datos del menú (edita aquí precios y platillos) =====
var I = { // nombres de guisos
  pata:{es:"Pata de res picada",en:"Chopped beef trotter"},
  asada:{es:"Carne asada",en:"Grilled steak"},
  champi:{es:"Champiñones",en:"Mushrooms"},
  rajas:{es:"Rajas",en:"Poblano strips"},
  tinga:{es:"Tinga de res",en:"Shredded beef tinga"},
  puerco:{es:"Puerco asado",en:"Grilled pork"},
  pollo:{es:"Pollo asado",en:"Grilled chicken"},
  molida:{es:"Carne molida",en:"Ground beef"},
  tingap:{es:"Tinga de pollo",en:"Chicken tinga"},
  quesillo:{es:"Quesillo",en:"Oaxaca cheese"},
  espinaca:{es:"Espinaca con papas",en:"Spinach with potatoes"},
  chich:{es:"Chicharrón prensado",en:"Pressed pork rind"},
  nopales:{es:"Nopales",en:"Cactus paddles"},
  chorizo:{es:"Chorizo",en:"Chorizo"},
  chichv:{es:"Chicharrón en salsa verde",en:"Pork rind in green salsa"},
  papach:{es:"Papa con chorizo",en:"Potato with chorizo"}
};
var UI = {
  es:{tagline:"Antojitos artesanales hechos con recetas tradicionales",extra:"Ingrediente extra",extras:"Extras",
      foot:"Precios en pesos mexicanos. Sujetos a cambio sin previo aviso.",
      demo:'Menú digital de demostración creado por <a href="../">Ing. Wolf</a>.',
      promos:"Promociones",drinks:"Bebidas",nav:"Secciones",
      queso:"Queso fresco",lechuga:"Lechuga",crema:"Crema",trad:"Tradicional"},
  en:{tagline:"Handcrafted street food made with traditional recipes",extra:"Extra ingredient",extras:"Extras",
      foot:"Prices in Mexican pesos. Subject to change without notice.",
      demo:'Demo digital menu created by <a href="../">Ing. Wolf</a>.',
      promos:"Specials",drinks:"Drinks",nav:"Sections",
      queso:"Fresh cheese",lechuga:"Lettuce",crema:"Cream",trad:"Traditional"}
};
var CATS = [
  {id:"tostadas",name:{es:"Tostadas",en:"Tostadas"},
   desc:{es:"Tostada hecha en casa cubierta de frijol, lechuga, crema y queso fresco. Adornada con jitomate y aguacate.",en:"House-made tostada topped with beans, lettuce, cream and fresh cheese, garnished with tomato and avocado."},
   tiers:[
    {k:"brown",items:[["pata",30],["asada",40],["champi",40]],extra:15},
    {k:"red",items:[["rajas",38],["tinga",38],["puerco",38]],extra:12},
    {k:"mustard",items:[["pollo",35],["molida",35],["tingap",35]],extra:8},
    {k:"green",items:[["espinaca",30],["chich",30],["nopales",30],["chorizo",30],["chichv",30],["papach",30]],extra:8}]},
  {id:"quesarinas",name:{es:"Quesarinas",en:"Quesarinas"},
   desc:{es:"Tortilla de harina doblada acompañada de quesillo derretido, lechuga picada y media crema.",en:"Folded flour tortilla with melted Oaxaca cheese, chopped lettuce and light cream."},
   tiers:[
    {k:"brown",items:[["asada",40],["champi",40]],extra:15},
    {k:"red",items:[["rajas",38],["tinga",38],["puerco",38]],extra:12},
    {k:"mustard",items:[["pollo",35],["molida",35],["tingap",35]],extra:8},
    {k:"green",items:[["quesillo",30],["espinaca",30],["chich",30],["nopales",30],["chorizo",30],["chichv",30],["papach",30]],extra:8}]},
  {id:"huaraches",name:{es:"Huaraches",en:"Huaraches"},
   desc:{es:"Tortilla de maíz alargada acompañada de frijoles refritos, lechuga picada, crema y queso fresco.",en:"Oblong corn tortilla with refried beans, chopped lettuce, cream and fresh cheese."},
   tiers:[
    {k:"brown",items:[["asada",65],["champi",65]],extra:20},
    {k:"red",items:[["rajas",55],["tinga",55],["puerco",55]],extra:15},
    {k:"mustard",items:[["pollo",50],["molida",50],["tingap",50]],extra:12},
    {k:"green",items:[["espinaca",40],["chich",40],["nopales",40],["chorizo",40],["chichv",40],["papach",40]],extra:8}]},
  {id:"pambazos",name:{es:"Pambazos",en:"Pambazos"},
   desc:{es:"Pan pambazo bañado en salsa de chile guajillo y acompañado con lechuga, crema y queso fresco.",en:"Bread dipped in guajillo chile sauce, served with lettuce, cream and fresh cheese."},
   tiers:[
    {k:"green",label:"trad",items:[["papach",40]]}, // TODO: confirmar precio del pambazo tradicional (no se lee en el menú impreso)
    {k:"brown",items:[["asada",65],["champi",65]],extra:20},
    {k:"red",items:[["rajas",55],["tinga",55],["puerco",55]],extra:15},
    {k:"mustard",items:[["pollo",50],["molida",50],["tingap",50]],extra:12},
    {k:"green",items:[["espinaca",40],["chich",40],["nopales",40],["chorizo",40],["chichv",40],["papach",40]],extra:8}]},
  {id:"quesadillas",name:{es:"Quesadillas",en:"Quesadillas"},
   desc:{es:"Tortilla de maíz hecha a mano doblada acompañada de lechuga, crema y quesillo derretido.",en:"Handmade folded corn tortilla with lettuce, cream and melted Oaxaca cheese."},
   tiers:[
    {k:"brown",items:[["asada",45],["champi",45]],extra:15},
    {k:"red",items:[["rajas",42],["tinga",42],["puerco",42]],extra:12},
    {k:"mustard",items:[["pollo",35],["molida",35],["tingap",35]],extra:8},
    {k:"green",items:[["quesillo",32],["espinaca",32],["chich",32],["nopales",32],["chorizo",32],["chichv",32],["papach",32]],extra:5}]},
  {id:"sopes",name:{es:"Sopes",en:"Sopes"},
   desc:{es:"Tortilla de maíz redonda pellizcada acompañada con frijol, lechuga, crema y queso derretido.",en:"Round pinched corn tortilla with beans, lettuce, cream and melted cheese."},
   tiers:[
    {k:"brown",items:[["asada",45],["champi",45]],extra:15},
    {k:"red",items:[["rajas",42],["tinga",42],["puerco",42]],extra:12},
    {k:"mustard",items:[["pollo",35],["molida",35],["tingap",35]],extra:8},
    {k:"green",items:[["espinaca",32],["chich",32],["nopales",32],["chorizo",32],["chichv",32],["papach",32]],extra:5}]}
];
var PROMOS = [
  {c:"",day:{es:"Sábados y domingos",en:"Saturdays & Sundays"},t:{es:"Caldito de cortesía",en:"Complimentary broth"},d:{es:"Con tu pedido te regalamos un caldito. *Aplican restricciones.",en:"Enjoy a free cup of broth with your order. *Restrictions apply."}},
  {c:"r",day:{es:"Domingos",en:"Sundays"},t:{es:"Tostadas de pata 3x2",en:"Trotter tostadas 3-for-2"},d:{es:"Pide tres tostadas de pata y paga solo dos.",en:"Order three trotter tostadas and pay for two."}},
  {c:"b",day:{es:"Viernes",en:"Fridays"},t:{es:"Pambazo tradicional gratis",en:"Free traditional pambazo"},d:{es:"En la compra de 3 huaraches de cualquier sección, el pambazo tradicional va por nuestra cuenta.",en:"Buy any 3 huaraches and get a traditional pambazo on the house."}},
  {c:"g",day:{es:"Miércoles y jueves",en:"Wednesdays & Thursdays"},t:{es:"Quesadillas de sección verde 8x$90",en:"Green-section quesadillas 8 for $90"},d:{es:"*Quesillo, espinaca con papas, chicharrón prensado, nopales, chorizo, chicharrón en salsa verde y papa con chorizo.",en:"*Oaxaca cheese, spinach with potatoes, pressed pork rind, cactus, chorizo, pork rind in green salsa and potato with chorizo."}},
  {c:"",day:{es:"Tarjeta de puntos M.K.",en:"M.K. rewards card"},t:{es:"Acumula puntos en cada consumo",en:"Earn points on every order"},d:{es:"Descarga la app de Loyalzoo y canjea tus puntos por productos disponibles.",en:"Download the Loyalzoo app and redeem your points for available items."}},
  {c:"b",day:{es:"Reseña en Google Maps",en:"Google Maps review"},t:{es:"¿Te gustaría una quesadilla gratis?",en:"Want a free quesadilla?"},d:{es:"Danos una reseña de 5 estrellas en Google Maps. Promoción válida una vez por persona.",en:"Leave us a 5-star review on Google Maps. Valid once per person."}}
];
var DRINKS = [
  {c:"d1",n:{es:"Jugos",en:"Juices"},p:30},
  {c:"d2",n:{es:"Aguas",en:"Waters"},p:30},
  {c:"d3",n:{es:"Refrescos",en:"Sodas"},p:30}
];

// ===== Render =====
var lang = "es";
try { lang = localStorage.getItem("mk-lang") || (navigator.language && navigator.language.indexOf("en") === 0 ? "en" : "es"); } catch(e){}
var el = function(id){ return document.getElementById(id); };

function render(){
  var u = UI[lang];
  document.documentElement.lang = lang;
  el("langBtn").textContent = lang === "es" ? "EN" : "ES";
  document.querySelectorAll("[data-i]").forEach(function(n){ n.innerHTML = u[n.getAttribute("data-i")]; });

  var nav = '<a href="#promos">' + u.promos + '</a>';
  CATS.forEach(function(c){ nav += '<a href="#' + c.id + '">' + c.name[lang] + '</a>'; });
  nav += '<a href="#bebidas">' + u.drinks + '</a>';
  el("nav").innerHTML = nav;

  var h = '<section id="promos"><div class="head"><h2>' + u.promos + '</h2></div><div class="promos">' +
    PROMOS.map(function(p){ return '<article class="promo ' + p.c + '"><span class="day">' + p.day[lang] + '</span><h3>' + p.t[lang] + '</h3><p>' + p.d[lang] + '</p></article>'; }).join("") + '</div></section>';

  CATS.forEach(function(c){
    h += '<section id="' + c.id + '"><div class="head"><h2>' + c.name[lang] + '</h2></div><p class="desc">' + c.desc[lang] + '</p><div class="grid">';
    c.tiers.forEach(function(t){
      h += '<div class="tier k-' + t.k + '"><div class="items">' +
        (t.label ? '<div class="row"><span style="font-weight:700;text-transform:uppercase;font-size:.8rem;letter-spacing:.05em">' + u[t.label] + '</span><span></span></div>' : '') +
        t.items.map(function(it){ return '<div class="row"><span>' + I[it[0]][lang] + '</span><b>$' + it[1] + '</b></div>'; }).join("") +
        '</div>' + (t.extra ? '<div class="extra"><span>' + u.extra + '</span><span>+$' + t.extra + '</span></div>' : '') + '</div>';
    });
    h += '</div><div class="addons"><span>' + u.extras + ':</span>' +
      ['queso','lechuga','crema'].map(function(k){ return '<span class="chip">' + u[k] + ' +$5</span>'; }).join("") + '</div></section>';
  });

  h += '<section id="bebidas"><div class="head"><h2>' + u.drinks + '</h2></div><div class="drinks">' +
    DRINKS.map(function(d){ return '<div class="drink ' + d.c + '"><h3>' + d.n[lang] + '</h3><div class="pr">$' + d.p + '</div></div>'; }).join("") + '</div></section>';

  el("menu").innerHTML = h;
  watch();
}

// Animación de entrada y resaltado de la sección actual
var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
  es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, {threshold:.12}) : null;
function watch(){
  document.querySelectorAll(".tier,.promo,.drink").forEach(function(n){ if (io) io.observe(n); else n.classList.add("in"); });
  // Respaldo: si el navegador no dispara el observador, todo se muestra a los 2 s
  setTimeout(function(){ document.querySelectorAll(".tier,.promo,.drink").forEach(function(n){ n.classList.add("in"); }); }, 2000);
  if (!("IntersectionObserver" in window)) return;
  var links = document.querySelectorAll("nav a");
  var spy = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (e.isIntersecting) links.forEach(function(a){ a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id); });
    });
  }, {rootMargin:"-35% 0px -60% 0px"});
  document.querySelectorAll("main section").forEach(function(s){ spy.observe(s); });
}

el("langBtn").addEventListener("click", function(){
  lang = lang === "es" ? "en" : "es";
  try { localStorage.setItem("mk-lang", lang); } catch(e){}
  render();
});
render();
</script>
</body>
</html>
