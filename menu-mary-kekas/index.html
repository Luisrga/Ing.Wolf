var cur = 0;
var lang = "es";
try { lang = localStorage.getItem("mk-lang") || (navigator.language && navigator.language.indexOf("en") === 0 ? "en" : "es"); } catch(e){}
var el = function(id){ return document.getElementById(id); };
function waLink(){ return "https://wa.me/" + WA_NUM + "?text=" + encodeURIComponent(lang === "es" ? "Hola Mary Kekas, quiero hacer un pedido 🌮" : "Hi Mary Kekas, I'd like to place an order 🌮"); }

function render(){
  var u = UI[lang];
  document.documentElement.lang = lang;
  el("langBtn").textContent = lang === "es" ? "EN" : "ES";
  el("rateTop").href = REVIEW; el("rateTop").textContent = lang === "es" ? "★ Calificar" : "★ Rate us";
  el("waTop").href = waLink();
  document.querySelectorAll("[data-i]").forEach(function(n){ n.innerHTML = u[n.getAttribute("data-i")]; });

  var nav = '<a href="#promos" data-k="promos">' + u.promos + '</a>';
  GROUPS.forEach(function(g, i){ nav += '<a href="#carta" data-k="' + g.id + '" data-p="' + i + '">' + g.name[lang] + '</a>'; });
  nav += '<a href="#bebidas" data-k="bebidas" data-p="1">' + u.drinks + '</a><a href="#domicilio" data-k="domicilio">' + u.deliv + '</a><a href="#visitanos" data-k="visitanos">' + u.visit + '</a>';
  el("nav").innerHTML = nav;

  var h = '<section id="promos"><div class="head"><h2>' + u.promos + '</h2></div><div class="cards">' +
    PROMOS.map(function(p){ return '<article class="promo ' + p.c + '"><span class="day">' + p.day[lang] + '</span><h3>' + p.t[lang] + '</h3><p>' + p.d[lang] + '</p></article>'; }).join("") + '</div></section>';

  h += '<section id="carta"><div class="tabs" role="tablist">' +
    GROUPS.map(function(g, i){ return '<button type="button" class="tab' + (cur === i ? ' on' : '') + '" role="tab" data-p="' + i + '" aria-selected="' + (cur === i) + '">' + g.name[lang] + '</button>'; }).join("") + '</div>';
  GROUPS.forEach(function(g, gi){
    h += '<div class="page" id="pg' + gi + '" role="tabpanel"' + (cur === gi ? '' : ' hidden') + '><div>' +
      '<img class="pic" src="' + g.img + '" alt="' + g.name[lang] + '">' +
      '<div class="photos">' + g.photos.map(function(p, pi){ return '<figure class="photo"><img src="' + p[0] + '" alt="' + p[1][lang] + '" loading="lazy"><p class="desc">' + g.desc[lang][pi] + '</p></figure>'; }).join("") + '</div>';
    h += '</div><div><div class="pick"><span>' + u.pick + ':</span>' +
      g.photos.map(function(p, pi){ return '<button type="button" class="pk' + (selP[gi] === pi ? ' on' : '') + '" data-g="' + gi + '" data-p="' + pi + '">' + p[1][lang] + '</button>'; }).join("") + '</div><div class="grid">';
    SECS.forEach(function(s, i){
      h += '<div class="tier k-' + s.k + '"><div class="items"><div class="sec">' + s.n[lang] + '</div>' +
        s.items.map(function(k){ return '<div class="row"><span>' + I[k][lang] + '</span><span class="rt"><b>$' + g.price[i] + '</b><span class="q" hidden></span><button type="button" class="add" data-g="' + gi + '" data-it="' + k + '" aria-label="' + u.add + ': ' + I[k][lang] + '">+</button></span></div>'; }).join("") +
        '</div><div class="extra"><span>' + u.guisado + '</span><span>+$' + g.extra[i] + '</span></div></div>';
    });
    h += '</div><div class="addons"><span>' + u.comp + ':</span>' +
      COMP.map(function(c){ return '<span class="chip">' + c[1][lang] + ' +$8</span>'; }).join("") + '</div></div>';
    if (gi === 1) {
      h += '<div class="minor" id="bebidas"><h3 class="mh">' + u.drinks + '</h3><div class="drinks"><img class="pic" src="img/bebidas.jpg" alt="' + u.drinks + '" loading="lazy">' +
        '<div><div class="dl">' + DRINKS.map(function(d, di){ return '<div class="row"><span>' + d.n[lang] + '</span><span class="rt"><b>$' + d.p + '</b><span class="q" hidden></span><button type="button" class="add" data-d="' + di + '" aria-label="' + u.add + ': ' + d.n[lang] + '">+</button></span></div>'; }).join("") + '</div><p class="note">' + u.vary + '</p></div></div></div>';
    }
    h += '</div>';
  });
  h += '</section>';

  h += '<section id="domicilio"><div class="head"><h2>' + u.deliv + '</h2></div><p class="desc"><b>' + u.dTitle + '</b> · ' + u.dDesc + '</p>' +
    '<div class="posters"><a href="' + UBER + '" target="_blank" rel="noopener"><img src="img/ubereats.jpg" alt="Uber Eats" loading="lazy"></a><a href="' + RAPPI + '" target="_blank" rel="noopener"><img src="img/rappi.jpg" alt="Rappi" loading="lazy"></a></div>' +
    '<div class="pills"><a class="pill" href="' + UBER + '" target="_blank" rel="noopener">Uber Eats →</a><a class="pill" href="' + RAPPI + '" target="_blank" rel="noopener">Rappi →</a></div></section>';

  h += '<section id="visitanos"><div class="head"><h2>' + u.visit + '</h2></div><div class="info">' +
    '<a href="' + MAPS + '" target="_blank" rel="noopener"><span class="ic">📍</span><span><b>' + u.addr + '</b><small>' + u.addrV + '</small><small>' + u.maps + ' →</small></span></a>' +
    '<a href="tel:+52' + TEL + '"><span class="ic">📞</span><span><b>' + u.phone + '</b><small>998 159 1114</small></span></a>' +
    '<div><span class="ic">🕘</span><span><b>' + u.hours + '</b><small>' + u.hoursV + '</small><small>' + u.hoursN + '</small></span></div></div>' +
    '<div class="review"><b>' + u.revT + '</b><p>' + u.revD + '</p><a class="pill" href="' + REVIEW + '" target="_blank" rel="noopener">' + u.revB + '</a></div></section>';

  el("menu").innerHTML = h;
  watch();
  updateCart();
}

var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
  es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, {threshold:.12}) : null;
function watch(){
  document.querySelectorAll(".tier,.promo").forEach(function(n){ if (io) io.observe(n); else n.classList.add("in"); });
  setTimeout(function(){ document.querySelectorAll(".tier,.promo").forEach(function(n){ n.classList.add("in"); }); }, 2000);
  document.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){ showPage(+b.getAttribute("data-p")); });
  });
  document.querySelectorAll("nav a[data-p]").forEach(function(a){
    a.addEventListener("click", function(ev){
      ev.preventDefault();
      showPage(+a.getAttribute("data-p"));
      var t = el(a.getAttribute("data-k") === "bebidas" ? "bebidas" : "carta");
      if (t) t.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  track();
}
function showPage(i){
  cur = i;
  document.querySelectorAll(".tab").forEach(function(b, k){ b.classList.toggle("on", k === i); b.setAttribute("aria-selected", k === i); });
  document.querySelectorAll(".page").forEach(function(p, k){ p.hidden = k !== i; });
  track();
}
var lastKey = null;
function setOn(k){
  if (k === lastKey && document.querySelector("nav a.on")) return;
  lastKey = k;
  var wrap = el("nav");
  document.querySelectorAll("nav a").forEach(function(a){
    var on = a.getAttribute("data-k") === k;
    a.classList.toggle("on", on);
    if (on) {
      var x = a.getBoundingClientRect().left - wrap.getBoundingClientRect().left + wrap.scrollLeft - (wrap.clientWidth - a.offsetWidth) / 2;
      x = Math.max(0, Math.min(x, wrap.scrollWidth - wrap.clientWidth));
      if (wrap.scrollTo) wrap.scrollTo({left: x, behavior: "smooth"}); else wrap.scrollLeft = x;
    }
  });
}
function track(){
  var band = window.innerHeight * 0.35, key = "promos";
  if (window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4) key = "visitanos";
  else {
    ["promos","carta","domicilio","visitanos"].forEach(function(id){ var n = el(id); if (n && n.getBoundingClientRect().top <= band) key = id; });
    if (key === "carta") {
      var b = el("bebidas");
      key = (cur === 1 && b && b.getBoundingClientRect().top <= band) ? "bebidas" : GROUPS[cur].id;
    }
  }
  setOn(key);
}
var ticking = false;
window.addEventListener("scroll", function(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(function(){ ticking = false; track(); });
}, {passive:true});

// ===== Carrito / pedido =====
var cart = {}, cnote = "", cwho = "", selP = [0, 0, 0], sheetOpen = false, waiterMode = false;
var editK = null, editX = [], editC = [];
try { var sv = JSON.parse(localStorage.getItem("mk-cart") || "null"); if (sv) { cart = sv.c || {}; cnote = sv.n || ""; cwho = sv.w || ""; } } catch(e){}
function saveCart(){ try { localStorage.setItem("mk-cart", JSON.stringify({c:cart, n:cnote, w:cwho})); } catch(e){} }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var COMP_PRICE = 8;
function tierOf(item){ for (var i = 0; i < SECS.length; i++) if (SECS[i].items.indexOf(item) >= 0) return i; return -1; }
function allItems(){ var a = []; SECS.forEach(function(s){ a = a.concat(s.items); }); return a; }
// Clave: "g|grupo|platillo|guisado" o "d|bebida", con extras opcionales: "#x:guisado,guisado;c:comp,comp"
function encodeMods(xs, cs){
  var X = allItems().filter(function(k){ return xs.indexOf(k) >= 0; });
  var C = COMP.map(function(c){ return c[0]; }).filter(function(k){ return cs.indexOf(k) >= 0; });
  return (X.length || C.length) ? "#x:" + X.join(",") + ";c:" + C.join(",") : "";
}
function parseKey(key){
  var parts = key.split("#"), mods = parts[1] || "", xs = [], cs = [];
  mods.split(";").forEach(function(m){
    if (m.indexOf("x:") === 0) xs = m.slice(2).split(",").filter(Boolean);
    else if (m.indexOf("c:") === 0) cs = m.slice(2).split(",").filter(Boolean);
  });
  return {base:parts[0], xs:xs, cs:cs};
}
function lineInfo(key){
  var pk = parseKey(key), p = pk.base.split("|");
  if (p[0] === "d") { var d = DRINKS[+p[1]]; return d ? {name:d.n[lang], price:d.p, base:pk.base, drink:true, xs:[], cs:[]} : null; }
  var g = GROUPS[+p[1]]; if (!g || !g.photos[+p[2]] || !I[p[3]]) return null;
  var t = tierOf(p[3]); if (t < 0) return null;
  var name = g.photos[+p[2]][1][lang] + " — " + I[p[3]][lang], price = g.price[t], ok = true;
  pk.xs.forEach(function(x){ var xt = tierOf(x); if (xt < 0) { ok = false; return; } price += g.extra[xt]; name += " + " + I[x][lang] + " " + UI[lang].extraWord; });
  pk.cs.forEach(function(c){
    var cc = COMP.filter(function(z){ return z[0] === c; })[0];
    if (!cc) { ok = false; return; } price += COMP_PRICE; name += " + " + cc[1][lang];
  });
  return ok ? {name:name, price:price, base:pk.base, g:g, item:p[3], xs:pk.xs, cs:pk.cs} : null;
}
function cartLines(){
  var out = [];
  Object.keys(cart).forEach(function(k){ var i = lineInfo(k); if (i) out.push({k:k, q:cart[k], name:i.name, price:i.price, drink:!!i.drink}); else delete cart[k]; });
  return out;
}
function cartTotals(){ var n = 0, t = 0; cartLines().forEach(function(l){ n += l.q; t += l.q * l.price; }); return {n:n, t:t}; }
function keyOf(b){
  if (b.getAttribute("data-d") !== null) return "d|" + b.getAttribute("data-d");
  var g = +b.getAttribute("data-g"); return "g|" + g + "|" + selP[g] + "|" + b.getAttribute("data-it");
}
function change(key, d){
  var q = (cart[key] || 0) + d;
  if (q <= 0) delete cart[key]; else cart[key] = Math.min(q, 50);
  saveCart(); updateCart();
  if (d > 0) { var f = el("cartFab"); f.classList.remove("bump"); void f.offsetWidth; f.classList.add("bump"); }
}
function updateCart(){
  var u = UI[lang], t = cartTotals();
  el("cartFab").textContent = "🛒 " + u.cart + (t.n ? " (" + t.n + ") · $" + t.t : "");
  document.querySelectorAll(".add").forEach(function(b){
    var base = keyOf(b), q = 0, s = b.parentNode.querySelector(".q");
    Object.keys(cart).forEach(function(k){ if (k.split("#")[0] === base) q += cart[k]; });
    s.textContent = q ? "×" + q : ""; s.hidden = !q;
  });
  if (sheetOpen) renderSheet();
}
function waCartLink(){
  var u = UI[lang], lines = cartLines(), t = cartTotals();
  var m = u.hello + "\n\n" + lines.map(function(l){ return "• " + l.q + " × " + l.name + " — $" + (l.q * l.price); }).join("\n") + "\n\n" + u.total + ": $" + t.t;
  if (cwho) m += "\n" + u.tableL + ": " + cwho;
  if (cnote) m += "\n" + u.notesL + ": " + cnote;
  return "https://wa.me/" + WA_NUM + "?text=" + encodeURIComponent(m);
}
function renderSheet(){
  var u = UI[lang], lines = cartLines(), t = cartTotals(), h = "";
  if (editK) {
    var info = lineInfo(editK), g = info.g, mods = encodeMods(editX, editC), unit = lineInfo(info.base + mods).price;
    var chip = function(act, v, on, label){ return '<button type="button" class="pk' + (on ? ' on' : '') + '" data-act="' + act + '" data-v="' + v + '" aria-pressed="' + on + '">' + label + '</button>'; };
    h = '<div class="sh-head"><h3 id="cartTitle">' + u.custom + '</h3><button type="button" class="x" data-act="cancel" aria-label="' + u.close + '">✕</button></div>' +
      '<p class="cn">' + esc(lineInfo(info.base).name) + (cart[editK] > 1 ? '<small>' + u.onePiece + '</small>' : '') + '</p>' +
      '<h4 class="eh">' + u.extraG + '</h4>' +
      SECS.map(function(s, si){
        return '<div class="chips"><span class="sec">' + s.n[lang] + ' · +$' + g.extra[si] + '</span>' +
          s.items.map(function(k){ return chip("tx", k, editX.indexOf(k) >= 0, I[k][lang]); }).join("") + '</div>';
      }).join("") +
      '<h4 class="eh">' + u.comps + '</h4><div class="chips">' +
      COMP.map(function(c){ return chip("tc", c[0], editC.indexOf(c[0]) >= 0, c[1][lang]); }).join("") + '</div>' +
      '<div class="tot"><span>' + u.unitP + '</span><span>$' + unit + '</span></div>' +
      '<div class="acts"><button type="button" class="pill wa" data-act="save">' + u.save + '</button><button type="button" class="pill" data-act="cancel">' + u.cancel + '</button></div>';
  } else if (waiterMode) {
    h = '<div class="sh-head"><h3 id="cartTitle">' + u.showW + '</h3><button type="button" class="x" data-act="close" aria-label="' + u.close + '">✕</button></div><ul class="wl">' +
      lines.map(function(l){ return '<li><b>' + l.q + '×</b>' + esc(l.name) + '</li>'; }).join("") + '</ul>' +
      (cwho ? '<p class="wnote">' + u.tableL + ': ' + esc(cwho) + '</p>' : '') + (cnote ? '<p class="wnote">' + u.notesL + ': ' + esc(cnote) + '</p>' : '') +
      '<div class="tot"><span>' + u.total + '</span><span>$' + t.t + '</span></div><div class="acts"><button type="button" class="pill" data-act="back">← ' + u.back + '</button></div>';
  } else if (!lines.length) {
    h = '<div class="sh-head"><h3 id="cartTitle">' + u.cart + '</h3><button type="button" class="x" data-act="close" aria-label="' + u.close + '">✕</button></div><p class="empty">' + u.cartEmpty + '</p>';
  } else {
    h = '<div class="sh-head"><h3 id="cartTitle">' + u.cart + '</h3><button type="button" class="x" data-act="close" aria-label="' + u.close + '">✕</button></div>' +
      lines.map(function(l){
        return '<div class="cl"><div class="cn">' + esc(l.name) + '<small>$' + l.price + ' ' + u.each + '</small></div>' +
          '<div class="cq"><button type="button" data-act="dec" data-k="' + esc(l.k) + '" aria-label="−">−</button><b>' + l.q + '</b><button type="button" data-act="inc" data-k="' + esc(l.k) + '" aria-label="+">+</button></div>' +
          '<div class="ct">$' + (l.q * l.price) + '</div>' +
          (l.drink ? '' : '<button type="button" class="pill cust" data-act="cust" data-k="' + esc(l.k) + '">✎ ' + u.custom + '</button>') + '</div>';
      }).join("") +
      '<div class="tot"><span>' + u.total + '</span><span>$' + t.t + '</span></div><p class="note">' + u.ivaN + '</p>' +
      '<label class="fld">' + u.who + '<input id="cwho" type="text" maxlength="60" value="' + esc(cwho) + '"></label>' +
      '<label class="fld">' + u.notes + '<textarea id="cnote" rows="2" maxlength="300" placeholder="' + esc(u.notesPh) + '">' + esc(cnote) + '</textarea></label>' +
      '<div class="acts"><button type="button" class="pill wa" data-act="send">' + u.send + '</button>' +
      '<button type="button" class="pill" data-act="waiter">' + u.waiter + '</button>' +
      '<button type="button" class="pill lnk" data-act="clear">' + u.clear + '</button></div>';
  }
  el("cartBody").innerHTML = h;
}
function openSheet(){ sheetOpen = true; waiterMode = false; editK = null; el("sheet").hidden = false; document.body.style.overflow = "hidden"; renderSheet(); }
function closeSheet(){ sheetOpen = false; el("sheet").hidden = true; document.body.style.overflow = ""; }
el("cartFab").addEventListener("click", openSheet);
el("sheet").addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var a = b.getAttribute("data-act");
  if (a === "close") closeSheet();
  else if (a === "inc") change(b.getAttribute("data-k"), 1);
  else if (a === "dec") change(b.getAttribute("data-k"), -1);
  else if (a === "clear") { cart = {}; cnote = ""; cwho = ""; saveCart(); updateCart(); }
  else if (a === "cust") { var ci = lineInfo(b.getAttribute("data-k")); if (ci) { editK = b.getAttribute("data-k"); editX = ci.xs.slice(); editC = ci.cs.slice(); renderSheet(); } }
  else if (a === "tx" || a === "tc") {
    var arr = a === "tx" ? editX : editC, v = b.getAttribute("data-v"), ix = arr.indexOf(v);
    if (ix >= 0) arr.splice(ix, 1); else arr.push(v);
    renderSheet();
  }
  else if (a === "cancel") { editK = null; renderSheet(); }
  else if (a === "save") {
    var nk = lineInfo(editK).base + encodeMods(editX, editC);
    if (nk !== editK) {
      cart[editK] = (cart[editK] || 1) - 1; if (cart[editK] <= 0) delete cart[editK];
      cart[nk] = Math.min((cart[nk] || 0) + 1, 50);
      saveCart();
    }
    editK = null; updateCart();
  }
  else if (a === "waiter") { waiterMode = true; renderSheet(); }
  else if (a === "back") { waiterMode = false; renderSheet(); }
  else if (a === "send") window.open(waCartLink(), "_blank", "noopener");
});
el("sheet").addEventListener("input", function(e){
  if (e.target.id === "cwho") cwho = e.target.value; else if (e.target.id === "cnote") cnote = e.target.value; else return;
  saveCart();
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && sheetOpen) closeSheet(); });
el("menu").addEventListener("click", function(e){
  var b = e.target.closest(".add");
  if (b) { change(keyOf(b), 1); return; }
  var p = e.target.closest(".pk");
  if (p) {
    var g = +p.getAttribute("data-g"); selP[g] = +p.getAttribute("data-p");
    p.parentNode.querySelectorAll(".pk").forEach(function(x){ x.classList.toggle("on", x === p); });
    updateCart();
  }
});

el("langBtn").addEventListener("click", function(){
  lang = lang === "es" ? "en" : "es";
  try { localStorage.setItem("mk-lang", lang); } catch(e){}
  render();
});
render();
