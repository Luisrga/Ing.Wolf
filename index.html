<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ing. Wolf | Luis Gutiérrez Aguilar</title>
<meta name="description" content="Portafolio de proyectos de Luis Gutiérrez Aguilar, Ing. Wolf.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3FB;--text:#0A1633;--muted:#44557A;--card:#FFFFFF;--border:#CBD7EE;--accent:#1D4ED8;--accent2:#0B2A7A;--glow:rgba(29,78,216,.18);--grid:rgba(10,22,51,.05);--on-accent:#FFFFFF;--eye:#7DD3FC}
:root[data-theme="dark"]{--bg:#050A18;--text:#E6EEFF;--muted:#9FB2D9;--card:#0B1630;--border:#1E3366;--accent:#3B82F6;--accent2:#1E40AF;--glow:rgba(59,130,246,.28);--grid:rgba(159,178,217,.06);--on-accent:#050A18;--eye:#7DD3FC}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.55;overflow-x:hidden;transition:background .4s,color .4s}
/* fondo animado */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);background:var(--accent);opacity:.22;animation:drift 18s ease-in-out infinite alternate}
.blob.b1{width:420px;height:420px;top:-120px;left:-100px}
.blob.b2{width:360px;height:360px;top:35%;right:-120px;background:var(--accent2);animation-duration:23s;animation-delay:-6s}
@keyframes drift{to{transform:translate(70px,60px) scale(1.18)}}

.wrap{max-width:780px;margin:0 auto;padding:0 16px 48px}
.bar{display:flex;justify-content:flex-end;gap:8px;padding:16px 0}
button,.btn{min-height:44px;min-width:44px;padding:0 18px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
button:hover,.btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 22px var(--glow)}
button:active,.btn:active{transform:translateY(0)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}

/* hero */
.hero{text-align:center;padding:16px 0 36px}
.logo{width:150px;height:150px;margin:0 auto 14px;display:block;filter:drop-shadow(0 10px 26px var(--glow));animation:float 6s ease-in-out infinite}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:clamp(2.2rem,7vw,3rem);font-weight:800;letter-spacing:-.03em;background:linear-gradient(90deg,var(--text),var(--accent),var(--text));background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:200% center}}
.name{margin:6px 0 0;font-weight:600;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;font-size:.85rem}
.tag{margin:14px auto 0;max-width:520px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}

/* entrada */
.rise{opacity:0;transform:translateY(22px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--d,0)*120ms)}
@keyframes rise{to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0)*100ms)}
.reveal.in{opacity:1;transform:none}

/* secciones */
h2{font-size:1.3rem;margin:40px 0 14px;display:flex;align-items:center;gap:12px}
h2::after{content:"";height:2px;flex:1;background:linear-gradient(90deg,var(--accent),transparent);border-radius:2px}
.grid{display:grid;gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 22px 20px;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}
.card::before{content:"";position:absolute;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--eye));transition:width .5s}
.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 16px 36px var(--glow)}
.card:hover::before{width:100%}
.card .num{position:absolute;right:16px;top:8px;font-size:2.6rem;font-weight:800;color:var(--accent);opacity:.12;line-height:1}
.card h3{margin:0 0 6px;font-size:1.15rem}
.card p{margin:0 0 14px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-size:.78rem;font-weight:600;margin-bottom:10px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags span{font-size:.78rem;padding:2px 9px;border-radius:7px;border:1px solid var(--border);color:var(--muted)}
.card a.go{color:var(--accent);font-weight:700;text-decoration:none;display:inline-flex;gap:6px}
.card a.go span{transition:transform .25s}
.card a.go:hover span{transform:translateX(5px)}

/* contacto */
.contact{margin-top:44px;text-align:center;padding:30px 20px;border-radius:20px;border:1px solid var(--border);background:linear-gradient(135deg,var(--card),transparent),var(--card);position:relative;overflow:hidden}
.contact::after{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,var(--glow),transparent 30%);animation:spin 14s linear infinite;z-index:0}
.contact>*{position:relative;z-index:1}
.contact h2{justify-content:center;margin:0 0 6px}
.contact h2::after{display:none}
.contact p{margin:0 0 18px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:36px}

/* navegación rápida */
.jump{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.jump a{min-height:40px;padding:0 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;transition:color .2s,background .2s}
.jump a:hover{color:var(--accent);background:var(--glow)}
#proyectos,#servicios{scroll-margin-top:16px}

/* servicios */
.sub{color:var(--muted);margin:-4px 0 18px}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.svc .card{padding:0;display:flex;flex-direction:column}
.svc .media{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--glow),transparent 70%),var(--bg);border-bottom:1px solid var(--border);overflow:hidden}
.svc .media>svg,.svc .media>img,.svc .media>video,.svc .media>iframe{width:100%;height:100%;display:block;object-fit:cover;border:0}
.svc .ex{position:absolute;left:10px;top:10px;z-index:2;font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.svc .body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.svc .body p{flex:1}
.svc .body .btn{align-self:flex-start}
/* ilustraciones */
.a-fill{fill:var(--card)}.a-edge{stroke:var(--border);stroke-width:1.5}
.a-bar,.a-line{fill:var(--border)}.a-acc{fill:var(--accent)}.a-soft{fill:var(--accent);opacity:.25}
.a-s{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.a-blink{animation:blink 1.4s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}
.a-bub{opacity:0;animation:bub 9s infinite}
@keyframes bub{0%,4%{opacity:0;transform:translateY(8px)}10%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
.a-scan{animation:scan 3.5s linear infinite}
@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(100px)}}
.a-wave{transform-box:fill-box;transform-origin:center;opacity:0;animation:wave 3s ease-out infinite}
@keyframes wave{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.a-bob{animation:float 4s ease-in-out infinite}
.a-drop{animation:drop 2.4s ease-in infinite}
@keyframes drop{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}
/* antes / después */
.ba{position:absolute;inset:0;--pos:50%}
.ba>svg{position:absolute;inset:0;width:100%;height:100%}
.ba .before{clip-path:inset(0 calc(100% - var(--pos)) 0 0);filter:saturate(.4) brightness(.72) contrast(.9) blur(.7px)}
.ba .line{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.5)}
.ba .tg{position:absolute;bottom:8px;font-size:.7rem;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:2px 9px;border-radius:999px}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}

/* chatbot */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chat-fab{position:fixed;right:16px;bottom:16px;z-index:50;width:60px;height:60px;border-radius:50%;padding:0;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;box-shadow:0 10px 28px var(--glow)}
.chat-fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 2.6s ease-out infinite;pointer-events:none}
@keyframes ring{to{transform:scale(1.6);opacity:0}}
.chat-fab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat{position:fixed;right:16px;bottom:88px;z-index:50;width:min(380px,calc(100vw - 32px));height:min(520px,calc(100vh - 110px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);overflow:hidden;animation:pop .25s ease-out}
.chat[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
.chat header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.chat header button{background:transparent;border:none;color:#fff;padding:0}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere;opacity:0;transform:translateY(8px);animation:rise .3s forwards}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}
.chip{min-height:40px;padding:0 13px;font-size:.85rem;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;cursor:pointer;font-weight:600;font-family:inherit}
.chip.go{background:var(--accent);color:var(--on-accent)}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
.chat form input{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 12px;font:inherit;font-size:16px}
.chat form input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rise,.reveal{opacity:1;transform:none}
}
</style>
</head>

function mediaFor(s, t){
  var m = s.media;
  if (m) {
    if (m.type === "img") return '<img src="' + m.src + '" alt="' + s.title[lang] + '" loading="lazy">';
    if (m.type === "video") return '<video controls playsinline preload="metadata" src="' + m.src + '"' + (m.poster ? ' poster="' + m.poster + '"' : '') + '></video>';
    if (m.type === "youtube") return '<iframe src="https://www.youtube-nocookie.com/embed/' + m.id + '" title="' + s.title[lang] + '" loading="lazy" allowfullscreen></iframe>';
  }
  return ART[s.art](t) + '<span class="ex">' + t.example + '</span>';
}

var chat = { step:"idle", service:null, name:"", lang:null };
var elChat = document.getElementById("chatPanel"), elLog = document.getElementById("chatLog"), elInput = document.getElementById("chatInput"), elFab = document.getElementById("chatFab");

function C(){ return CHAT[lang]; }
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function addMsg(who, text, chips){
  var m = document.createElement("div"); m.className = "msg " + who; m.textContent = text; elLog.appendChild(m);
  if (chips && chips.length) {
    var row = document.createElement("div"); row.className = "chips";
    chips.forEach(function(c){
      var b;
      if (c.href) { b = document.createElement("a"); b.href = c.href; b.target = "_blank"; b.rel = "noopener"; b.className = "chip go"; }
      else { b = document.createElement("button"); b.type = "button"; b.className = "chip";
        b.addEventListener("click", function(){ row.remove(); addMsg("user", c.label); setTimeout(c.go, 350); }); }
      b.textContent = c.label; row.appendChild(b);
    });
    elLog.appendChild(row);
  }
  elLog.scrollTop = elLog.scrollHeight;
}
function serviceChips(){
  return SERVICES.map(function(s){ return { label:s.short[lang], go:function(){ pickService(s); } }; })
    .concat([{ label:C().human, href:WA + encodeURIComponent(lang === "es" ? "Hola Luis, vi tu página y quiero información." : "Hi Luis, I saw your website and I'd like more information.") }]);
}
function pickService(s){
  chat.service = s;
  addMsg("bot", s.desc[lang], [{ label:C().quote, go:startQuote }, { label:C().other, go:function(){ addMsg("bot", C().pick, serviceChips()); } }]);
}
function startQuote(){
  if (chat.name) { chat.step = "detail"; addMsg("bot", C().askDetail(chat.name)); }
  else { chat.step = "name"; addMsg("bot", C().askName); }
}
function finishQuote(detail){
  chat.step = "idle";
  var text = C().msg(chat.name, chat.service ? chat.service.title[lang] : "-", detail);
  addMsg("bot", C().ready, [{ label:C().wa, href:WA + encodeURIComponent(text) }]);
}
function matchService(text){
  var q = norm(text), words = q.split(/[^a-z0-9\-]+/);
  for (var i = 0; i < SERVICES.length; i++) for (var k = 0; k < SERVICES[i].kw.length; k++) {
    var w = SERVICES[i].kw[k];
    if (words.indexOf(w) > -1 || (w.length > 3 && q.indexOf(w) > -1)) return SERVICES[i];
  }
  return null;
}
function route(text){
  if (chat.step === "name") { chat.name = text.slice(0, 60); chat.step = "detail"; addMsg("bot", C().askDetail(chat.name)); return; }
  if (chat.step === "detail") { finishQuote(text.slice(0, 300)); return; }
  var s = matchService(text);
  if (s) { pickService(s); return; }
  if (/precio|costo|cuanto|cotiz|price|cost|quote|how much/i.test(norm(text))) { addMsg("bot", C().price, serviceChips()); return; }
  if (/^(hola|buen|hello|hi|hey)/i.test(norm(text))) { addMsg("bot", C().hello, serviceChips()); return; }
  addMsg("bot", C().fallback, serviceChips());
}
function chatReset(){
  elLog.innerHTML = ""; chat.step = "idle"; chat.service = null; chat.name = "";
  addMsg("bot", C().hello, serviceChips());
}
function chatRefresh(){
  var c = C();
  document.getElementById("chatTitle").textContent = c.title;
  document.getElementById("chatClose").setAttribute("aria-label", c.close);
  document.getElementById("chatFabLabel").textContent = c.open;
  document.getElementById("chatSend").textContent = c.send;
  elInput.placeholder = c.placeholder;
  elChat.setAttribute("aria-label", c.title);
  if (chat.lang !== lang) { chat.lang = lang; chatReset(); }
}
function setChat(open){
  elChat.hidden = !open;
  elFab.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) { elInput.focus(); elLog.scrollTop = elLog.scrollHeight; }
}
function quoteFor(id){
  var s = SERVICES.filter(function(x){ return x.id === id; })[0];
  if (!s) return;
  setChat(true); chat.service = s;
  addMsg("user", C().about(s.short[lang]));
  setTimeout(startQuote, 350);
}
elFab.addEventListener("click", function(){ setChat(elChat.hidden); });
document.getElementById("chatClose").addEventListener("click", function(){ setChat(false); elFab.focus(); });
elChat.addEventListener("keydown", function(e){ if (e.key === "Escape") { setChat(false); elFab.focus(); } });
document.getElementById("chatForm").addEventListener("submit", function(e){
  e.preventDefault();
  var v = elInput.value.trim(); if (!v) return;
  elInput.value = ""; addMsg("user", v); setTimeout(function(){ route(v); }, 350);
});

function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function save(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
  entries.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: 0.12 }) : null;
function watch(el){ if (io) io.observe(el); else el.classList.add("in"); }

function render(){
  var t = TEXT[lang];
  root.lang = lang;
  root.setAttribute("data-theme", theme);
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t[el.getAttribute("data-i18n")]; });
  document.getElementById("lang").textContent  = t.otherLang;
  document.getElementById("theme").textContent = theme === "dark" ? t.toLight : t.toDark;

  document.getElementById("links").innerHTML = [["linkedin","primary"],["instagram",""],["whatsapp",""]]
    .map(function(x){ return '<a class="btn ' + x[1] + '" href="' + LINKS[x[0]] + '" target="_blank" rel="noopener">' + ICONS[x[0]] + t[x[0]] + '</a>'; }).join("");

  var cta = document.getElementById("cta");
  cta.href = LINKS.whatsapp;
  cta.innerHTML = ICONS.whatsapp + t.cta;

  var box = document.getElementById("projects");
  box.innerHTML = PROJECTS.map(function(p, i){
    return '<article class="card reveal" style="--d:' + i + '"><span class="num">0' + (i + 1) + '</span>' +
      '<span class="badge">' + p.status[lang] + '</span>' +
      '<h3>' + p.title[lang] + '</h3><p>' + p.desc[lang] + '</p>' +
      (p.tags.length ? '<div class="tags">' + p.tags.map(function(x){ return '<span>' + x + '</span>'; }).join("") + '</div>' : "") +
      (p.url ? '<a class="go" href="' + p.url + '"' + (p.sameTab ? '' : ' target="_blank" rel="noopener"') + '>' + t.view + ' <span>→</span></a>' : "") +
      '</article>';
  }).join("");
  box.querySelectorAll(".reveal").forEach(watch);
  renderServices(t);
  chatRefresh();
}

document.getElementById("lang").addEventListener("click", function(){ lang = lang === "es" ? "en" : "es"; save("lang", lang); render(); });
document.getElementById("theme").addEventListener("click", function(){ theme = theme === "dark" ? "light" : "dark"; save("theme", theme); render(); });
document.getElementById("year").textContent = new Date().getFullYear();
document.querySelectorAll("main > .reveal").forEach(watch);
render();
</script>
</body>
</html>
