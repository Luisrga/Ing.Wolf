<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ing. Wolf | Luis Gutiérrez Aguilar</title>
<meta name="description" content="Portafolio de proyectos de Luis Gutiérrez Aguilar, Ing. Wolf.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3FB;--text:#0A1633;--muted:#44557A;--card:#FFFFFF;--border:#CBD7EE;--accent:#1D4ED8;--accent2:#0B2A7A;--on-accent:#FFFFFF;--eye:#7DD3FC}
:root[data-theme="dark"]{--bg:#050A18;--text:#E6EEFF;--muted:#9FB2D9;--card:#0B1630;--border:#1E3366;--accent:#3B82F6;--accent2:#1E40AF;--on-accent:#050A18;--eye:#7DD3FC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
.bar{display:flex;justify-content:flex-end;gap:8px;padding:16px 0}
button,.btn{min-height:44px;min-width:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{text-align:center;padding:16px 0 32px}
.logo{width:132px;height:132px;margin:0 auto 12px;display:block}
h1{margin:0;font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.name{margin:4px 0 0;font-weight:600;color:var(--accent)}
.tag{margin:12px auto 0;max-width:520px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
h2{font-size:1.25rem;margin:32px 0 12px}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;font-size:1.1rem}
.card p{margin:0 0 12px;color:var(--muted)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-size:.8rem;font-weight:600;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tags span{font-size:.8rem;padding:2px 8px;border-radius:6px;border:1px solid var(--border);color:var(--muted)}
.card a{color:var(--accent);font-weight:600}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button id="lang" type="button">English</button>
    <button id="theme" type="button">☀️ Claro</button>
  </div>

  <header class="hero">
    <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="Ing. Wolf">
      <defs>
        <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--accent)"/>
          <stop offset="1" stop-color="var(--accent2)"/>
        </linearGradient>
      </defs>
      <!-- engranaje -->
      <circle cx="50" cy="50" r="46" fill="none" stroke="var(--accent)" stroke-width="7" stroke-dasharray="6.02 6.02" opacity=".55"/>
      <circle cx="50" cy="50" r="42" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"/>
      <!-- lobo -->
      <g transform="translate(50 53) scale(.74) translate(-50 -52)">
        <path d="M18 10 L38 30 L62 30 L82 10 L87 46 L74 70 L59 87 L50 94 L41 87 L26 70 L13 46 Z" fill="url(#wg)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M24 22 L33 33 L26 44 Z M76 22 L67 33 L74 44 Z" fill="var(--bg)" opacity=".45"/>
        <path d="M50 30 L50 62" stroke="var(--bg)" stroke-width="2" opacity=".35"/>
        <path d="M30 48 L45 54 L31 58 Z M70 48 L55 54 L69 58 Z" fill="var(--eye)"/>
        <path d="M43 78 L57 78 L50 88 Z" fill="var(--bg)"/>
        <path d="M30 66 L42 72 M70 66 L58 72" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      </g>
    </svg>
    <h1>Ing. Wolf</h1>
    <p class="name">Luis Gutiérrez Aguilar</p>
    <p class="tag" data-i18n="tagline">Ingeniería, tecnología y proyectos que resuelven problemas reales.</p>
    <div class="links" id="links"></div>
  </header>

  <main>
    <h2 data-i18n="projects">Proyectos</h2>
    <div class="grid" id="projects"></div>
  </main>

  <footer>© <span id="year"></span> Ing. Wolf · Luis Gutiérrez Aguilar</footer>
</div>

<script>
// ====== EDITA AQUÍ ======
// Pon tus enlaces reales. WhatsApp: https://wa.me/52 + tu número (sin espacios ni +).
var LINKS = {
  linkedin:  "https://www.linkedin.com/in/TU-USUARIO",
  instagram: "https://www.instagram.com/TU-USUARIO",
  whatsapp:  "https://wa.me/52XXXXXXXXXX"
};

// Para agregar un proyecto copia un bloque. "url" es opcional (déjalo "" si no hay enlace).
var PROJECTS = [
  {
    status: {es:"En desarrollo", en:"In development"},
    title:  {es:"Car Control", en:"Car Control"},
    desc:   {es:"Aplicación web para controlar gastos, documentos y kilometraje de vehículos, con control de rentas entre propietario y chofer. Incluye bot de Telegram y lectura de tickets.",
             en:"Web app to track vehicle expenses, documents and mileage, with rental control between owner and driver. Includes a Telegram bot and receipt scanning."},
    tags:   ["Next.js","Supabase","Telegram","PWA"],
    url:    ""
  },
  {
    status: {es:"En desarrollo", en:"In development"},
    title:  {es:"Apuestas de bajo riesgo", en:"Low-risk betting analysis"},
    desc:   {es:"Sistema de análisis de partidos para seleccionar apuestas de bajo riesgo, con reportes y seguimiento en Excel.",
             en:"Match analysis system to pick low-risk bets, with reports and Excel tracking."},
    tags:   ["Análisis","Excel","Automatización"],
    url:    ""
  },
  {
    status: {es:"Próximamente", en:"Coming soon"},
    title:  {es:"Más proyectos", en:"More projects"},
    desc:   {es:"Estoy sumando nuevos proyectos de ingeniería y tecnología. Vuelve pronto.",
             en:"I'm adding new engineering and technology projects. Check back soon."},
    tags:   [],
    url:    ""
  }
];

var TEXT = {
  es:{tagline:"Ingeniería, tecnología y proyectos que resuelven problemas reales.",projects:"Proyectos",
      linkedin:"LinkedIn",instagram:"Instagram",whatsapp:"WhatsApp",view:"Ver proyecto",
      toDark:"🌙 Oscuro",toLight:"☀️ Claro",otherLang:"English"},
  en:{tagline:"Engineering, technology and projects that solve real problems.",projects:"Projects",
      linkedin:"LinkedIn",instagram:"Instagram",whatsapp:"WhatsApp",view:"View project",
      toDark:"🌙 Dark",toLight:"☀️ Light",otherLang:"Español"}
};
// ========================

var root = document.documentElement;
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function save(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

var lang  = load("lang")  || ((navigator.language || "es").toLowerCase().indexOf("en") === 0 ? "en" : "es");
var theme = load("theme") || "dark";

function render(){
  var t = TEXT[lang];
  root.lang = lang;
  root.setAttribute("data-theme", theme);
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t[el.getAttribute("data-i18n")]; });
  document.getElementById("lang").textContent  = t.otherLang;
  document.getElementById("theme").textContent = theme === "dark" ? t.toLight : t.toDark;

  document.getElementById("links").innerHTML = [["linkedin","primary"],["instagram",""],["whatsapp",""]]
    .map(function(x){ return '<a class="btn ' + x[1] + '" href="' + LINKS[x[0]] + '" target="_blank" rel="noopener">' + t[x[0]] + '</a>'; }).join("");

  document.getElementById("projects").innerHTML = PROJECTS.map(function(p){
    return '<article class="card"><span class="badge">' + p.status[lang] + '</span>' +
      '<h3>' + p.title[lang] + '</h3><p>' + p.desc[lang] + '</p>' +
      (p.tags.length ? '<div class="tags">' + p.tags.map(function(x){ return '<span>' + x + '</span>'; }).join("") + '</div>' : "") +
      (p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener">' + t.view + ' →</a>' : "") +
      '</article>';
  }).join("");
}

document.getElementById("lang").addEventListener("click", function(){ lang = lang === "es" ? "en" : "es"; save("lang", lang); render(); });
document.getElementById("theme").addEventListener("click", function(){ theme = theme === "dark" ? "light" : "dark"; save("theme", theme); render(); });
document.getElementById("year").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
